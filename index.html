<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="ImageData\LegendOfZariaHeader.png" alt="Legend of Zaria title card" class="MainHeaderImage">
        <img src="ImageData\HeaderDivider.png" alt="Header Divider" class="MainHeaderDivider">
    </header>
    <main>
       
        <img src="ImageData\BattleDangerHeader.png" controls alt="Battle Header Text" class="SmallHeaderImage">
<!--The First Box Goes Here-->
         <div class="ShowContainer">
            <video autoplay muted loop playsinline class="DisplayVideo">
                <source src="Videos\CombatVideo.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <div class="TextBox">
                <img src="ImageData/MonsterInfo.png" alt="Monster Info" class="TextBoxImage">
            </div>
        </div>
         <img src="ImageData\DividerTwo.png" alt="Header Divider" class="Divider">

<img src="ImageData\ExploreZaria.png" controls alt="Battle Header Text" class="SmallHeaderImageSmaller">
<!--The Second Box Goes Here-->
         <div class="ShowContainer">
            <div class="TextBox">
                <img src="ImageData/TravelInfo.png" alt="Monster Info" class="TextBoxImage">
            </div>
            <video autoplay muted loop playsinline class="DisplayVideo">
                <source src="Videos\ExploreVideo.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        <img src="ImageData\DividerTwo.png" alt="Header Divider" class="Divider">

        <img src="ImageData\Experience The Story.png" controls alt="Battle Header Text" class="SmallHeaderImage">
<!--The Third Box Goes Here-->
        <div class="ShowContainer">
            <video autoplay muted loop playsinline class="DisplayVideo">
                <source src="Videos\StoryVideo.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <div class="TextBox">
                <img src="ImageData/StoryInfo.png" alt="Monster Info" class="TextBoxImage">
            </div>
        </div>
        <img src="ImageData\DividerTwo.png" alt="Header Divider" class="Divider">

        
<!--Garen's Box with the text and button goes here-->
        <div class="GarenBox">
        <img src="ImageData\Garen.png" controls alt="Garen" width="40%">
<!--The text and button go in this div box-->
         <div class="GarenText">
             <h1>Buy the book.</h1>
             <h2>Download and play the game for free!</h2>

             <a href="https://www.amazon.com/" target="_blank">
             <img src="ImageData/BuyBut.png"
             onmouseover="this.src='ImageData/BuyButHov.png';"
             onmouseout="this.src='ImageData/BuyBut.png';"
             onclick="this.src='ImageData/BuyButClick.png'"
             alt="Buy Button"
             class="Button">
             </a>

            <a href="download.html" target="_self">
                <img src="ImageData/DownBut.png"
                onmouseover="this.src='ImageData/DownButHov.png';"
                onmouseout="this.src='ImageData/DownBut.png';"
                onclick="this.src='ImageData/DownButClick.png'"
                alt="Download Button"
                class="Button">
            </a>

         </div>
        </div>
        <img src="ImageData\DividerTwo.png" alt="Header Divider" class="Divider">

 <!--Image Slide Show-->
<img src="ImageData\Gallery.png" controls alt="Battle Header Text" class="CenterHeaderImage">
<!--Row 1-->
<div class="ImageGallery">
<img src="ImageData/SlideShow/Slide1.png" alt="BanditCombat" class="SlideImage">
<img src="ImageData/SlideShow/Slide2.png" alt="BanditCombat" class="SlideImage">
<img src="ImageData/SlideShow/Slide3.png" alt="TreasureGame" class="SlideImage">
<img src="ImageData/SlideShow/Slide4.png" alt="TreasureGame" class="SlideImage">
</div>
<!--Row 2-->
<div class="ImageGallery">
<img src="ImageData/SlideShow/Slide5.png" alt="Challage Stone" class="SlideImage">
<img src="ImageData/SlideShow/Slide6.png" alt="BanditCombat" class="SlideImage">
<img src="ImageData/SlideShow/Slide7.png" alt="TreasureGame" class="SlideImage">
<img src="ImageData/SlideShow/Slide8.png" alt="TreasureGame" class="SlideImage">
</div>
<!--Row 3-->
<div class="ImageGallery">
<img src="ImageData/SlideShow/Slide9.png" alt="Challage Stone" class="SlideImage">
<img src="ImageData/SlideShow/Slide10.png" alt="BanditCombat" class="SlideImage">
<img src="ImageData/SlideShow/Slide11.png" alt="TreasureGame" class="SlideImage">
<img src="ImageData/SlideShow/Slide12.png" alt="TreasureGame" class="SlideImage">
</div>
  <img src="ImageData\DividerTwo.png" alt="Header Divider" class="Divider">

  <img src="ImageData\Vano Dialogue.png" alt="Vano Dialogue" class="Dialogue">


    </main>
    <footer>
        <p>&copy; 2026 Toban Barnes </p>
    </footer>
</body>
</html>
